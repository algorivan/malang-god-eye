        function handleSearchInput() {
            const query = $("#location-search").val().trim().toLowerCase();

            const $suggestionsList = $("#suggestions-list");
            $suggestionsList.empty();

            if (query.length < 3) {
                $suggestionsList.addClass('hidden');
                return;
            }

            let suggestions = [];

            // console.log(MARKER_COORDS);
            
            MARKER_COORDS.forEach(marker => {
                if (marker.address.toLowerCase().includes(query) ||
                    marker.name.toLowerCase().includes(query) || 
                    marker.nama_kecamatan?.toLowerCase().includes(query)) {
                    suggestions.push({
                        title: marker.name,
                        name: `${marker.address} (${marker.nama_kecamatan})`,
                        lat: parseFloat(marker.latitude),
                        lng: parseFloat(marker.longitude)
                    });
                }
            });

            KECAMATAN_COORDS.forEach(kecamatan => {
                if (kecamatan.nama_m_kecamatan.toLowerCase().includes(query)) {
                    suggestions.push({
                        title: kecamatan.nama_m_kecamatan,
                        name: kecamatan.nama_m_kecamatan,
                        lat: parseFloat(kecamatan.lat_m_kecamatan),
                        lng: parseFloat(kecamatan.lng_m_kecamatan)
                    });
                }
            });

            
            // const uniqueSuggestions = Array.from(new Set(suggestions.map(a => a.name)))
            //     .map(name => suggestions.find(a => a.name === name))
            //     .slice(0, 10);

            const uniqueSuggestions = Array.from(
                    new Set(suggestions.map(a => `${a.name}|${a.title}`))
                )
                .map(id => suggestions.find(a => `${a.name}|${a.title}` === id))
                .slice(0, 10);

            if (uniqueSuggestions.length > 0) {
                uniqueSuggestions.forEach(s => {
                    const $item = $('<div>', {
                        class: 'p-3 cursor-pointer hover:bg-gray-100 transition duration-100 flex justify-between items-center border-b border-gray-100 last:border-b-0',
                        'data-lat': s.lat,
                        'data-lng': s.lng
                    }).html(`
                        <div>
                            <p class="font-medium text-gray-800">${s.name}</p>
                            <p class="text-xs text-gray-500">${s.title}</p>
                        </div>
                        <!-- Icon Pin -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.82 17.61a.5.5 0 0 0 .18-.32V6.71a.5.5 0 0 0-.18-.32l-5.06-3.4c-.2-.13-.48-.13-.68 0l-5.06 3.4a.5.5 0 0 0-.18.32v10.58c0 .12.06.24.18.32l5.06 3.4c.2.13.48.13.68 0l5.06-3.4z"></path></svg>
                    `);

                    $item.on('click', function() {
                        panToLocation(parseFloat($(this).data('lat')), parseFloat($(this).data('lng')), 17);
                    });

                    $suggestionsList.append($item);
                });
                $suggestionsList.removeClass('hidden');
            } else {
                $suggestionsList.addClass('hidden');
            }
        }
        
        function searchLocation() {
            const query = $("#location-search").val().trim().toLowerCase();
            if (query.length === 0) return;

            const allLocations = [
                ...MARKER_COORDS.map(m => ({
                    lat: m.latitude, 
                    lng: m.longitude, 
                    search_field: `${m.address} ${m.nama_kecamatan}`.toLowerCase()
                })), 
                ...KECAMATAN_COORDS.map(k => ({
                    lat: k.lat_m_kecamatan, 
                    lng: k.lng_m_kecamatan, 
                    search_field: k.nama_kecamatan.toLowerCase()
                })),
                ...KELURAHAN_COORDS.map(l => ({
                    lat: l.latitude, 
                    lng: l.longitude, 
                    search_field: `${l.nama_m_kelurahan} ${l.nama_m_kelurahan}`.toLowerCase()
                }))
            ];

            const match = allLocations.find(loc => loc.search_field.includes(query));

            if (match) {
                panToLocation(parseFloat(match.lat), parseFloat(match.lng), 14);
            } else {
                customAlert('Lokasi tidak ditemukan. Coba kata kunci lain.');
            }
        }

        let streamCheckInterval;
        let lastTimeUpdate = Date.now();
        const FREEZE_THRESHOLD_MS = 15000;
        const HEARTBEAT_INTERVAL_MS = 5000;
        
        let hls;

        function setupHeartbeatDetector() {
            if (streamCheckInterval) {
                clearInterval(streamCheckInterval);
            }
            
            lastTimeUpdate = Date.now();

            streamCheckInterval = setInterval(() => {
                const timeSinceLastUpdate = Date.now() - lastTimeUpdate;
                
                if (timeSinceLastUpdate > FREEZE_THRESHOLD_MS) {
                    console.warn(`[CCTV RELOAD] Stream freeze detected (${timeSinceLastUpdate / 1000}s without update). Attempting reload.`);
                    
                    clearInterval(streamCheckInterval);
                    
                    if ($('#cctv-modal-overlay').is(':visible')) {
                        $('#quality-info').removeClass().addClass('text-xs px-2 py-1 rounded-full bg-red-600 text-white font-semibold').text('Macet, Reloading...');
                        setTimeout(loadCCTVContent, 500); 
                    }
                }
            }, HEARTBEAT_INTERVAL_MS);
        }

        function updatePlayPauseIcon(videoElement) {
            const $iconContainer = $('#play-pause-icon');
            if (!videoElement || !$iconContainer.length) return;

            if (videoElement.paused) {
                $iconContainer.removeClass('hidden-play');
                $iconContainer.html(`
                    <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                `);
            } else {
                $iconContainer.addClass('hidden-play');
                $iconContainer.html(`
                    <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                `);
            }
        }
        
        function loadCCTVContent(id_stream) {

            let CCTV_URL = 'https://cctv.malangkota.go.id/cctv-stream/streams/' + id_stream + '.m3u8';

            if (streamCheckInterval) clearInterval(streamCheckInterval);
            if (hls) hls.destroy();

            $('#cctv-viewer').empty().html('<p id="loading-message" class="text-xl animate-pulse text-white">Memuat stream video...</p>');
            $('#quality-selector').prop('disabled', true).empty().append('<option value="-1">Auto</option>');

            const $video = $('<video>', {
                id: 'cctv-stream-video',
                autoplay: true,
                controls: false,
                muted: true, 
                playsinline: true, 
            });

            const videoElement = $video[0];
            
            const $playPauseOverlay = $('<div>', {
                id: 'play-pause-overlay',
            }).html(`
                <div id="play-pause-icon" class="play-button-icon hidden-play">
                    <!-- Ikon akan diisi oleh JS -->
                </div>
            `);

            $('#cctv-viewer').empty().append($playPauseOverlay).append($video);
            
            $playPauseOverlay.on('click', function() {
                if (videoElement.paused) {
                    videoElement.play().catch(e => console.error("Play error:", e));
                } else {
                    videoElement.pause();
                }
            });

            $video.on('play', function() {
                updatePlayPauseIcon(videoElement);
            }).on('pause', function() {
                updatePlayPauseIcon(videoElement);
            });
            // --------------------------------
            
            // 2. Inisialisasi HLS.js
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(CCTV_URL);
                hls.attachMedia(videoElement);

                // --- HLS Event Listeners ---
                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    console.log('Manifest parsed. Levels:', data.levels.length);

                    videoElement.play().catch(error => {
                        console.log("Autoplay failed:", error.name);
                        $('#cctv-viewer').append('<div class="absolute inset-0 bg-black bg-opacity-70 flex items-center justify-center z-40"><p class="text-white text-lg p-2 text-center rounded">Autoplay diblokir browser. Klik di video untuk memutar.</p></div>');
                        updatePlayPauseIcon(videoElement);
                    });
                });

                hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                    updateQualityInfo(hls);
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        console.error('HLS Fatal Error:', data.details);
                        if (hls) hls.destroy();
                        if ($('#cctv-modal-overlay').is(':visible')) {
                            console.log('Attempting auto-reload due to fatal HLS error.');
                            setTimeout(loadCCTVContent, 2000); 
                        } else {
                            $('#cctv-viewer').empty().html(`
                                <div class="p-4 text-center">
                                    <p class="text-xl text-red-400">Error Fatal HLS.</p>
                                    <p class="text-sm text-gray-400">Coba Segarkan Stream.</p>
                                </div>
                            `);
                            $('#refresh-modal-button').prop('disabled', false).text('Coba Lagi');
                        }
                    }
                });

            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = CCTV_URL;
                console.log('Using native HLS support.');
                $('#quality-info').removeClass().addClass('text-xs px-2 py-1 rounded-full bg-gray-600 text-white font-semibold').text('Native HLS (Auto)');
                
                videoElement.play().catch(error => {
                    console.log("Autoplay failed (Native):", error.name);
                    $('#cctv-viewer').append('<div class="absolute inset-0 bg-black bg-opacity-70 flex items-center justify-center z-40"><p class="text-white text-lg p-2 text-center rounded">Autoplay diblokir browser. Klik di video untuk memutar.</p></div>');
                    updatePlayPauseIcon(videoElement);
                });
            } else {
                $('#cctv-viewer').empty().html(`
                    <div class="p-4 text-center">
                        <p class="text-xl text-red-400">Browser Tidak Mendukung HLS.</p>
                        <p class="text-sm text-gray-400">Silakan gunakan browser modern (Chrome, Firefox, Safari).</p>
                    </div>
                `);
                $('#refresh-modal-button').prop('disabled', false).text('Coba Lagi');
                return;
            }

            $video.on('timeupdate', function() {
                lastTimeUpdate = Date.now();
            });

            $video.on('canplay', function() {
                $('#loading-message').remove();
                $('#refresh-modal-button').prop('disabled', false).text('Segarkan Stream');
                setupHeartbeatDetector();
                updatePlayPauseIcon(videoElement);
            });
            
            $video.on('error', function() {
                if (streamCheckInterval) clearInterval(streamCheckInterval);
                $('#quality-info').text('Error');
                $('#cctv-viewer').empty().html(`
                    <div class="p-4 text-center">
                        <p class="text-xl text-red-400">Gagal Memuat Stream.</p>
                        <p class="text-sm text-gray-400">Pastikan URL M3U8 aktif dan Nginx di-proxy dengan benar.</p>
                    </div>
                `);
                $('#refresh-modal-button').prop('disabled', false).text('Coba Lagi');
            });
        }

        function reloadStream() {
            console.log("Memuat ulang stream...");
            // lagWarning.classList.remove('hidden');
            // loadingOverlay.style.opacity = "1";
            
            if (hls) {
                hls.destroy();
                hls = null;
            }
            
            setTimeout(() => {
                loadCCTVContent(chache_id_marker)
                lagWarning.classList.add('hidden');
                loadingOverlay.style.opacity = "0";
                lastUpdatedText.innerText = "Status: Berhasil Dimuat Ulang";
            }, 500);
        }

        refreshBtn.addEventListener('click', reloadStream);

        function stopStream() {
            // console.log("Menghentikan akses stream...");
            const videoElement = document.getElementById('cctv-stream-video');
            
            if (hls) {
                hls.destroy();
                hls = null;
            }

            videoElement.src = "";
            videoElement.load();
        }
